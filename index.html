<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/smart_roster_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Smart Roster - Daily Time Record System" />
    <title>Smart Roster</title>
    <script>
      // Redirect to hash route if not already there
      if (!window.location.hash) {
        // Check if we're already at the base path with trailing slash
        var basePath = '/SmartRoster/';
        var currentPath = window.location.pathname;
        
        // Ensure we're at the correct base path
        if (currentPath !== basePath && !currentPath.startsWith(basePath)) {
          window.location.replace(basePath + '#/');
        } else {
          window.location.replace(window.location.href + '#/');
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
